name: Build APKs

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Twemoji assets
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/twemoji
          key: twemoji-${{ hashFiles('scripts/fetch-twemoji.sh', 'scripts/twemoji-font.py') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Ensure Android SDK permissions and accept licenses
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Release APK (${{ matrix.arch }})
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --build-cache -PreactNativeArchitectures=${{ matrix.arch }}

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/isocord-${{ matrix.arch }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: isocord-${{ matrix.arch }}
          path: dist/isocord-${{ matrix.arch }}.apk
          if-no-files-found: error

  aggregate:
    name: Package all APKs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: isocord-*
          path: dist
          merge-multiple: true

      - name: Upload all APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: isocord-all-apks
          path: dist/
          if-no-files-found: error
